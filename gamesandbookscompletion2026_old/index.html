<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Completions</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --accent: #bb86fc;
            --secondary: #03dac6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 10px;
        }

        .section-title {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
        }

        .card.book {
            border-left: 4px solid var(--secondary);
        }

        .card.game {
            border-left: 4px solid var(--accent);
        }

        .status {
            font-size: 0.8rem;
            display: block;
            margin-top: 10px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>2026 Archive</h1>
        <p>A log of completed media and adventures.</p>
    </header>

    <h2 class="section-title">Video Games</h2>
    <div class="grid">
        <div class="card game">
            <strong>Alan Wake 2</strong>
            <span class="status">✓ Completed</span>
        </div>
        <div class="card game">
            <strong>Resident Evil Requiem</strong>
            <span class="status">✓ Completed</span>
        </div>
        <div class="card game">
            <strong>Astrobot</strong>
            <span class="status">✓ Completed</span>
        </div>
    </div>

    <h2 class="section-title">Literature</h2>
    <div class="grid">
        <div class="card book">
            <strong>Граф Монте-Кристо</strong>
            <span class="status">📖 Read</span>
        </div>
        <div class="card book">
            <strong>Грозовой перевал</strong>
            <span class="status">📖 Read</span>
        </div>
        <div class="card book">
            <strong>Похождения бравого солдата Швейка</strong>
            <span class="status">📖 Read</span>
        </div>
    </div>
</div>

</body>
</html>
