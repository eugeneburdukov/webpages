<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Phone Upgrades History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0b0f19',
                            card: '#131b2e',
                            border: '#1f2d4d',
                            accent: '#3b82f6',
                            glow: '#60a5fa'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2d4d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        .glow-card {
            box-shadow: 0 0 20px -5px rgba(59, 130, 246, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-card:hover {
            box-shadow: 0 0 30px 0px rgba(59, 130, 246, 0.35);
            transform: translateY(-4px);
        }
        .timeline-line {
            background: linear-gradient(180deg, #8b5cf6 0%, #f59e0b 20%, #10b981 50%, #ec4899 100%);
        }
        .glass-panel {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="sticky top-0 z-40 glass-panel border-b border-cyber-border mb-6 sm:mb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30 flex-shrink-0">
                    <i class="fa-solid fa-mobile-screen-button text-lg sm:text-xl text-white"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                        <h1 class="text-base sm:text-xl font-bold tracking-tight text-white truncate">
                            Mobile Upgrade History
                        </h1>
                        <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 font-medium whitespace-nowrap">
                            2005 - 2024
                        </span>
                    </div>
                    <p class="text-[11px] sm:text-xs text-gray-400 truncate">Personal Phone Journey</p>
                </div>
            </div>

            <!-- View Mode Switcher -->
            <button id="viewToggleBtn" onclick="toggleView()" class="p-2.5 sm:px-3.5 sm:py-2 rounded-xl bg-cyber-card border border-cyber-border hover:border-blue-500/50 text-gray-300 text-xs sm:text-sm font-medium transition flex items-center gap-2 flex-shrink-0">
                <i id="viewToggleIcon" class="fa-solid fa-grip text-sm"></i>
                <span id="viewToggleText" class="hidden sm:inline">Grid View</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Brand Filter Badges & Search -->
        <section class="glass-panel p-3.5 sm:p-4 rounded-2xl border border-cyber-border mb-8 sm:mb-10 flex flex-col md:flex-row items-center justify-between gap-3 sm:gap-4">
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 no-scrollbar">
                <span class="text-xs text-gray-400 uppercase font-semibold mr-1 whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i> Filter:</span>
                <button onclick="filterBrand('all')" class="brand-btn active px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition border border-blue-500/50 shadow-lg shadow-blue-600/20 whitespace-nowrap">
                    All (10)
                </button>
                <button onclick="filterBrand('Apple')" class="brand-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyber-card text-gray-300 hover:text-white hover:bg-gray-800 transition border border-cyber-border whitespace-nowrap">
                    <i class="fa-brands fa-apple mr-1"></i> Apple (5)
                </button>
                <button onclick="filterBrand('Nokia')" class="brand-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyber-card text-gray-300 hover:text-white hover:bg-gray-800 transition border border-cyber-border whitespace-nowrap">
                    Nokia (3)
                </button>
                <button onclick="filterBrand('Sony Ericsson')" class="brand-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyber-card text-gray-300 hover:text-white hover:bg-gray-800 transition border border-cyber-border whitespace-nowrap">
                    Sony Ericsson (1)
                </button>
                <button onclick="filterBrand('Siemens')" class="brand-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyber-card text-gray-300 hover:text-white hover:bg-gray-800 transition border border-cyber-border whitespace-nowrap">
                    Siemens (1)
                </button>
            </div>

            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search model or specs..." class="w-full bg-cyber-bg border border-cyber-border rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition">
            </div>
        </section>

        <!-- Timeline Container -->
        <div id="timelineView" class="relative transition-all duration-300">
            <div id="centralLine" class="block absolute left-4 sm:left-6 lg:left-1/2 top-4 bottom-10 w-1 timeline-line rounded-full -translate-x-1/2 opacity-60"></div>
            <div id="cardsContainer" class="space-y-8 lg:space-y-12">
                <!-- Cards injected via JS -->
            </div>
        </div>
    </main>

    <div id="specModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-2xl bg-cyber-card border border-cyber-border rounded-3xl p-6 md:p-8 shadow-2xl overflow-hidden text-white max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-9 h-9 rounded-full bg-cyber-bg border border-cyber-border hover:bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modalContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>

            {

                name: "iPhone 15 Pro Max (256GB)",

                image: "images/15promax.png",
                tagline: "Titanium body, 5x Optical Zoom & USB-C",

                ],

                    camera: "48 MP Main + 12 MP 5x Telephoto + 12 MP Ultrawide",

                },

                    price: "63,499 UAH"
                },
                memories: "Current primary daily driver! Ultra lightweight titanium rails, fast USB-C, and incredible zoom photos."
            }
        ];

        let currentFilter = 'all';
        let currentView = 'timeline';

        function renderTimeline() {
            const container = document.getElementById('cardsContainer');
            const centralLine = document.getElementById('centralLine');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = phonesData.filter(phone => {
                const matchesBrand = currentFilter === 'all' || phone.brand.toLowerCase() === currentFilter.toLowerCase();
                const matchesSearch = phone.name.toLowerCase().includes(searchVal) || 
                                      phone.tagline.toLowerCase().includes(searchVal) ||
                                      phone.year.includes(searchVal);
                return matchesBrand && matchesSearch;
            });

            if (filtered.length === 0) {
                if (centralLine) centralLine.style.display = 'none';
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa-solid fa-mobile-xmark text-4xl mb-3"></i>
                        <p class="text-sm">No phones found matching your filter.</p>
                    </div>`;
                return;
            }

            if (currentView === 'timeline') {
                if (centralLine) centralLine.style.display = '';
                container.className = "space-y-8 lg:space-y-12";
                container.innerHTML = filtered.map((phone, idx) => createTimelineCardHTML(phone, idx % 2 === 1)).join('');
            } else {
                if (centralLine) centralLine.style.display = 'none';
                container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6";
                container.innerHTML = filtered.map(phone => createGridCardHTML(phone)).join('');
            }
        }

        function createTimelineCardHTML(phone, isEven) {
            return `
            <div class="relative flex flex-col lg:flex-row items-center ${isEven ? 'lg:flex-row-reverse' : ''} group pl-10 sm:pl-12 lg:pl-0">
                <div class="flex absolute left-4 sm:left-6 lg:left-1/2 -translate-x-1/2 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-cyber-card border-2 border-blue-500 items-center justify-center shadow-lg shadow-blue-500/40 z-10 top-0 lg:top-1/2 lg:-translate-y-1/2">
                    <span class="text-[10px] sm:text-xs font-bold text-white">${phone.year.slice(-2)}</span>
                </div>

                <div class="w-full lg:w-[calc(50%-2.5rem)]">
                    <div class="glass-panel p-5 sm:p-6 rounded-3xl border border-cyber-border glow-card transition duration-300">
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold border ${phone.badgeColor}">
                                ${phone.brand} • ${phone.year}
                            </span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                            <div class="sm:col-span-1 flex flex-col items-center justify-center py-2">
                                <div class="w-28 h-44 sm:w-32 sm:h-48 rounded-2xl overflow-hidden border border-cyber-border shadow-inner bg-white p-2.5 flex items-center justify-center">
                                    <img src="${phone.image}" alt="${phone.name}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/300x450/ffffff/1e293b?text=${encodeURIComponent(phone.name)}'">
                                </div>
                            </div>

                            <div class="sm:col-span-2 space-y-2 text-left">
                                <h3 class="text-xl font-bold text-white group-hover:text-blue-400 transition">${phone.name}</h3>
                                <p class="text-xs text-gray-300 italic">${phone.tagline}</p>
                                
                                <ul class="space-y-1.5 pt-2">
                                    ${phone.highlights.map(h => `
                                        <li class="text-xs text-gray-400 flex items-center gap-2">
                                            <i class="fa-solid fa-circle-check text-blue-400 text-[10px]"></i>
                                            <span>${h}</span>
                                        </li>
                                    `).join('')}
                                </ul>

                                ${phone.purchaseInfo ? `
                                    <div class="mt-3 p-2 rounded-xl bg-blue-950/40 border border-blue-500/30 text-xs text-blue-300 flex items-center justify-between">
                                        <span><i class="fa-solid fa-receipt mr-1"></i> ${phone.purchaseInfo.price}</span>
                                        <span class="font-mono text-[10px]">${phone.purchaseInfo.date}</span>
                                    </div>
                                ` : ''}

                                <button onclick="openModal('${phone.id}')" class="mt-3 w-full py-2 rounded-xl bg-cyber-bg hover:bg-blue-600/20 text-blue-400 text-xs font-semibold border border-cyber-border hover:border-blue-500/40 transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-microchip"></i> Full Specs & Notes
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function createGridCardHTML(phone) {
            return `
            <div class="glass-panel p-5 rounded-3xl border border-cyber-border glow-card flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${phone.badgeColor}">
                            ${phone.brand}
                        </span>
                        <span class="text-xs font-bold text-gray-400">${phone.year}</span>
                    </div>

                    <div class="py-2 flex justify-center">
                        <div class="w-full h-44 rounded-xl overflow-hidden border border-cyber-border bg-white p-2.5 flex items-center justify-center">
                            <img src="${phone.image}" alt="${phone.name}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/300x450/ffffff/1e293b?text=${encodeURIComponent(phone.name)}'">
                        </div>
                    </div>

                    <h3 class="text-lg font-bold text-white mt-2 mb-1">${phone.name}</h3>
                    <p class="text-xs text-gray-400 mb-3">${phone.tagline}</p>
                </div>

                <button onclick="openModal('${phone.id}')" class="w-full py-2 rounded-xl bg-cyber-bg hover:bg-blue-600/20 text-blue-400 text-xs font-semibold border border-cyber-border transition">
                    View Specs
                </button>
            </div>`;
        }

        function filterBrand(brand) {
            currentFilter = brand;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.className = "brand-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyber-card text-gray-300 hover:text-white transition border border-cyber-border whitespace-nowrap";
            });
            event.currentTarget.className = "brand-btn active px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition border border-blue-500/50 shadow-lg shadow-blue-600/20 whitespace-nowrap";
            renderTimeline();
        }

        function handleSearch() {
            renderTimeline();
        }

        function toggleView() {
            currentView = currentView === 'timeline' ? 'grid' : 'timeline';
            document.getElementById('viewToggleIcon').className = currentView === 'timeline' ? 'fa-solid fa-grip text-sm' : 'fa-solid fa-timeline text-sm';
            document.getElementById('viewToggleText').innerText = currentView === 'timeline' ? 'Grid View' : 'Timeline View';
            renderTimeline();
        }

        function openModal(id) {
            const phone = phonesData.find(p => p.id === id);
            if (!phone) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-16 h-24 rounded-xl overflow-hidden border border-cyber-border bg-white p-1.5 flex-shrink-0 flex items-center justify-center">
                        <img src="${phone.image}" class="max-w-full max-h-full object-contain">
                    </div>
                    <div>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${phone.badgeColor}">${phone.brand} • ${phone.year}</span>
                        <h2 class="text-2xl font-extrabold text-white mt-1">${phone.name}</h2>
                        <p class="text-xs text-gray-400">${phone.tagline}</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="bg-cyber-bg p-4 rounded-2xl border border-cyber-border">
                        <h4 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-microchip mr-1"></i> Technical Specs</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            <div><span class="text-gray-500">Display:</span> <span class="text-gray-200">${phone.specs.display}</span></div>
                            <div><span class="text-gray-500">Camera:</span> <span class="text-gray-200">${phone.specs.camera}</span></div>
                            <div><span class="text-gray-500">Battery:</span> <span class="text-gray-200">${phone.specs.battery}</span></div>
                            <div><span class="text-gray-500">Storage:</span> <span class="text-gray-200">${phone.specs.storage}</span></div>
                            <div><span class="text-gray-500">Weight:</span> <span class="text-gray-200">${phone.specs.weight}</span></div>
                            <div><span class="text-gray-500">OS:</span> <span class="text-gray-200">${phone.specs.os}</span></div>
                        </div>
                    </div>

                    <div class="bg-cyber-bg p-4 rounded-2xl border border-cyber-border">
                        <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-comment-dots mr-1"></i> Memories</h4>
                        <p class="text-xs text-gray-300 leading-relaxed">${phone.memories}</p>
                    </div>
                </div>
            `;

            const modal = document.getElementById('specModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('specModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        window.onload = renderTimeline;
    </script>
</body>
</html>
